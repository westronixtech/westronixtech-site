<!DOCTYPE html>

<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Africa Education Program | WESTRONIX TECH</title>

  <meta name="description" content="WESTRONIX TECH Africa Education Program — affordable technology, refurbished computers and digital learning opportunities for schools, students and communities across Africa.">
  <meta name="keywords" content="WESTRONIX TECH, Africa Education, refurbished computers, digital education, Togo, technology donation, computer labs, STEM">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: "Inter", Arial, sans-serif;
      background: #f5f7fa;
      color: #182230;
      line-height: 1.6;
    }

    img {
      max-width: 100%;
      display: block;
    }

    a {
      text-decoration: none;
      color: inherit;
    }

    button,
    input,
    select,
    textarea {
      font: inherit;
    }

    .container {
      width: min(1400px, 92%);
      margin: 0 auto;
    }

    /* ====================================
       UNIVERSAL HEADER
    ==================================== */

    .site-header {
      position: sticky;
      top: 0;
      z-index: 1000;
      background: #07111f;
      color: #fff;
      border-bottom: 1px solid rgba(255,255,255,.08);
      box-shadow: 0 4px 20px rgba(0,0,0,.15);
    }

    .header-inner {
      width: min(1400px, 94%);
      margin: 0 auto;
      min-height: 88px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
    }

    .brand-link {
      display: flex;
      align-items: center;
      gap: 14px;
      flex-shrink: 0;
    }

    .brand-logo {
      width: 72px;
      height: 72px;
      object-fit: contain;
      background: #fff;
      border-radius: 12px;
      padding: 4px;
    }

    .brand-name {
      font-size: 24px;
      line-height: 1.1;
      font-weight: 800;
      letter-spacing: -.5px;
      color: #fff;
    }

    .brand-tagline {
      margin-top: 5px;
      font-size: 11px;
      color: #aeb9c8;
      letter-spacing: .35px;
      text-transform: uppercase;
    }

    .nav {
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .nav a {
      color: #e8edf4;
      font-size: 14px;
      font-weight: 600;
      padding: 11px 13px;
      border-radius: 8px;
      transition: .2s ease;
      white-space: nowrap;
    }

    .nav a:hover {
      background: rgba(255,255,255,.08);
      color: #fff;
    }

    .nav a:last-child {
      background: #1677ff;
      color: #fff;
      margin-left: 5px;
    }

    .nav a:last-child:hover {
      background: #0d63d7;
    }

    .cart-count {
      display: inline-flex;
      min-width: 20px;
      height: 20px;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border-radius: 20px;
      background: #fff;
      color: #1677ff;
      font-size: 11px;
      font-weight: 800;
      margin-left: 4px;
    }

    .menu-toggle {
      display: none;
      border: 0;
      background: transparent;
      color: #fff;
      font-size: 28px;
      cursor: pointer;
      padding: 8px;
    }

    /* ====================================
       LANGUAGE BAR
    ==================================== */

    .language-bar {
      background: #fff;
      border-bottom: 1px solid #e4e8ee;
    }

    .language-inner {
      width: min(1400px, 92%);
      margin: 0 auto;
      min-height: 48px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 8px;
    }

    .language-label {
      font-size: 13px;
      color: #667085;
      margin-right: 5px;
    }

    .language-btn {
      border: 1px solid #d8dee8;
      background: #fff;
      color: #475467;
      border-radius: 7px;
      padding: 7px 12px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      transition: .2s;
    }

    .language-btn:hover,
    .language-btn.active {
      background: #07111f;
      color: #fff;
      border-color: #07111f;
    }

    /* ====================================
       HERO
    ==================================== */

    .hero {
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(circle at 85% 20%, rgba(22,119,255,.28), transparent 30%),
        linear-gradient(135deg, #07111f 0%, #0b1d33 55%, #102d4d 100%);
      color: #fff;
      padding: 100px 0 110px;
    }

    .hero::before {
      content: "";
      position: absolute;
      width: 500px;
      height: 500px;
      border: 1px solid rgba(255,255,255,.07);
      border-radius: 50%;
      right: -180px;
      top: -180px;
    }

    .hero-content {
      position: relative;
      z-index: 1;
      max-width: 850px;
    }

    .hero-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: rgba(255,255,255,.09);
      border: 1px solid rgba(255,255,255,.13);
      padding: 8px 14px;
      border-radius: 30px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .6px;
      text-transform: uppercase;
      margin-bottom: 22px;
    }

    .hero h1 {
      font-size: clamp(38px, 6vw, 68px);
      line-height: 1.04;
      letter-spacing: -2px;
      margin-bottom: 24px;
      font-weight: 800;
    }

    .hero h1 span {
      display: inline;
    }

    .hero p {
      max-width: 760px;
      color: #d8e3ef;
      font-size: clamp(17px, 2vw, 21px);
      line-height: 1.7;
      margin-bottom: 32px;
    }

    .hero-buttons {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      min-height: 48px;
      padding: 12px 20px;
      border-radius: 9px;
      border: 1px solid transparent;
      font-weight: 700;
      font-size: 14px;
      cursor: pointer;
      transition: .2s ease;
    }

    .btn-primary {
      background: #1677ff;
      color: #fff;
    }

    .btn-primary:hover {
      background: #0d63d7;
      transform: translateY(-1px);
    }

    .btn-green {
      background: #16a05d;
      color: #fff;
    }

    .btn-green:hover {
      background: #12834c;
      transform: translateY(-1px);
    }

    .btn-light {
      background: #fff;
      color: #07111f;
      border-color: #d9e0e8;
    }

    .btn-light:hover {
      background: #f1f4f8;
    }

    /* ====================================
       GENERAL SECTIONS
    ==================================== */

    .section {
      padding: 80px 0;
    }

    .section-alt {
      background: #fff;
    }

    .section-title {
      text-align: center;
      font-size: clamp(28px, 4vw, 40px);
      line-height: 1.2;
      margin-bottom: 42px;
      color: #07111f;
      letter-spacing: -.8px;
    }

    .section-subtitle {
      max-width: 720px;
      margin: -25px auto 42px;
      text-align: center;
      color: #667085;
      font-size: 16px;
    }

    /* ====================================
       MISSION
    ==================================== */

    .mission-box {
      background: #fff;
      border: 1px solid #e4e8ee;
      border-radius: 18px;
      padding: 55px;
      max-width: 1050px;
      margin: 0 auto;
      text-align: center;
      box-shadow: 0 10px 35px rgba(7,17,31,.06);
    }

    .mission-box h2 {
      color: #07111f;
      font-size: 34px;
      margin-bottom: 20px;
    }

    .mission-box p {
      color: #526071;
      font-size: 17px;
      line-height: 1.8;
    }

    /* ====================================
       IMPACT AREAS
    ==================================== */

    .impact-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .impact-card {
      background: #fff;
      border: 1px solid #e2e7ee;
      border-radius: 15px;
      padding: 30px 24px;
      transition: .25s ease;
    }

    .impact-card:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 35px rgba(7,17,31,.08);
      border-color: #cdd9e8;
    }

    .impact-icon {
      font-size: 38px;
      margin-bottom: 18px;
    }

    .impact-card h3 {
      font-size: 19px;
      color: #07111f;
      margin-bottom: 10px;
    }

    .impact-card p {
      color: #667085;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ====================================
       HOW IT WORKS
    ==================================== */

    .process-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
    }

    .process-step {
      position: relative;
      background: #07111f;
      color: #fff;
      border-radius: 15px;
      padding: 30px 24px;
      min-height: 220px;
    }

    .step-number {
      display: inline-flex;
      width: 38px;
      height: 38px;
      align-items: center;
      justify-content: center;
      background: #1677ff;
      border-radius: 50%;
      font-size: 14px;
      font-weight: 800;
      margin-bottom: 18px;
    }

    .process-step h3 {
      font-size: 19px;
      margin-bottom: 12px;
    }

    .process-step p {
      color: #c7d2df;
      font-size: 14px;
      line-height: 1.7;
    }

    /* ====================================
       REQUEST SECTION
    ==================================== */

    .request-section {
      background:
        linear-gradient(135deg, #eef5ff 0%, #f7fafc 100%);
    }

    .request-layout {
      display: grid;
      grid-template-columns: .8fr 1.2fr;
      gap: 40px;
      align-items: start;
    }

    .request-info {
      padding: 20px 0;
    }

    .request-info h2 {
      font-size: 38px;
      line-height: 1.2;
      color: #07111f;
      margin-bottom: 18px;
    }

    .request-info > p {
      color: #5c6878;
      font-size: 16px;
      line-height: 1.8;
      margin-bottom: 25px;
    }

    .info-list {
      display: grid;
      gap: 14px;
    }

    .info-item {
      display: flex;
      gap: 12px;
      align-items: flex-start;
    }

    .info-item-icon {
      width: 32px;
      height: 32px;
      flex-shrink: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #dceaff;
      border-radius: 8px;
    }

    .info-item strong {
      display: block;
      color: #07111f;
      font-size: 14px;
      margin-bottom: 2px;
    }

    .info-item span {
      color: #667085;
      font-size: 13px;
    }

    .request-form {
      background: #fff;
      border: 1px solid #e0e6ee;
      border-radius: 18px;
      padding: 35px;
      box-shadow: 0 15px 45px rgba(7,17,31,.08);
    }

    .form-title {
      font-size: 25px;
      color: #07111f;
      margin-bottom: 7px;
    }

    .form-description {
      color: #667085;
      font-size: 13px;
      margin-bottom: 25px;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 17px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 7px;
    }

    .form-group.full {
      grid-column: 1 / -1;
    }

    .form-group label {
      color: #344054;
      font-size: 13px;
      font-weight: 700;
    }

    .form-group input,
    .form-group select,
    .form-group textarea {
      width: 100%;
      border: 1px solid #d5dce5;
      background: #fff;
      color: #182230;
      border-radius: 8px;
      padding: 12px 13px;
      outline: none;
      transition: .2s;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus {
      border-color: #1677ff;
      box-shadow: 0 0 0 3px rgba(22,119,255,.1);
    }

    .form-group textarea {
      min-height: 120px;
      resize: vertical;
    }

    .form-group small {
      color: #7a8696;
      font-size: 11px;
    }

    .form-submit {
      margin-top: 22px;
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .form-submit .btn {
      flex: 1;
    }

    .form-note {
      margin-top: 15px;
      background: #f5f8fb;
      border-radius: 8px;
      padding: 12px;
      color: #667085;
      font-size: 11px;
      line-height: 1.6;
    }

    /* ====================================
       IMPACT CTA
    ==================================== */

    .impact-cta {
      background: #07111f;
      color: #fff;
      text-align: center;
    }

    .impact-cta h2 {
      font-size: clamp(30px, 4vw, 44px);
      margin-bottom: 16px;
    }

    .impact-cta p {
      max-width: 700px;
      margin: 0 auto 28px;
      color: #c7d2df;
      line-height: 1.8;
    }

    .cta-buttons {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
    }

    /* ====================================
       FOOTER
    ==================================== */

    footer {
      background: #040b14;
      color: #fff;
      padding: 55px 0 25px;
    }

    .footer-grid {
      display: grid;
      grid-template-columns: 1.5fr 1fr 1fr 1fr;
      gap: 40px;
      padding-bottom: 40px;
    }

    .footer-brand img {
      width: 62px;
      height: 62px;
      background: #fff;
      padding: 4px;
      border-radius: 10px;
      margin-bottom: 15px;
    }

    .footer-brand h3 {
      font-size: 20px;
      margin-bottom: 9px;
    }

    .footer-brand p {
      color: #9eabba;
      font-size: 13px;
      max-width: 330px;
      line-height: 1.7;
    }

    .footer-column h4 {
      font-size: 14px;
      margin-bottom: 15px;
    }

    .footer-column a {
      display: block;
      color: #9eabba;
      font-size: 13px;
      margin-bottom: 9px;
      transition: .2s;
    }

    .footer-column a:hover {
      color: #fff;
    }

    .footer-bottom {
      border-top: 1px solid rgba(255,255,255,.08);
      padding-top: 20px;
      display: flex;
      justify-content: space-between;
      gap: 15px;
      flex-wrap: wrap;
      color: #7e8a98;
      font-size: 11px;
    }

    /* ====================================
       FORM STATUS
    ==================================== */

    .form-status {
      display: none;
      margin-top: 15px;
      padding: 13px;
      border-radius: 8px;
      font-size: 13px;
      line-height: 1.6;
    }

    .form-status.success {
      display: block;
      background: #e8f8ef;
      border: 1px solid #b8e7ca;
      color: #126b3c;
    }

    .form-status.error {
      display: block;
      background: #fff0f0;
      border: 1px solid #f1c4c4;
      color: #a52828;
    }

    /* ====================================
       RESPONSIVE
    ==================================== */

    @media (max-width: 1050px) {
      .nav {
        gap: 0;
      }

      .nav a {
        padding: 10px 8px;
        font-size: 12px;
      }

      .impact-grid,
      .process-grid {
        grid-template-columns: repeat(2, 1fr);
      }

      .request-layout {
        grid-template-columns: 1fr;
      }

      .request-info {
        max-width: 800px;
      }

      .footer-grid {
        grid-template-columns: repeat(2, 1fr);
      }
    }

    @media (max-width: 768px) {
      .header-inner {
        min-height: 76px;
      }

      .brand-logo {
        width: 58px;
        height: 58px;
      }

      .brand-name {
        font-size: 18px;
      }

      .brand-tagline {
        display: none;
      }

      .menu-toggle {
        display: block;
      }

      .nav {
        position: absolute;
        top: 76px;
        left: 0;
        right: 0;
        background: #07111f;
        display: none;
        flex-direction: column;
        align-items: stretch;
        padding: 10px;
        border-top: 1px solid rgba(255,255,255,.08);
        box-shadow: 0 15px 25px rgba(0,0,0,.2);
      }

      .nav.open {
        display: flex;
      }

      .nav a {
        width: 100%;
        padding: 13px 14px;
        font-size: 14px;
      }

      .nav a:last-child {
        margin: 3px 0 0;
      }

      .hero {
        padding: 70px 0 75px;
      }

      .hero h1 {
        letter-spacing: -1px;
      }

      .hero-buttons,
      .cta-buttons {
        flex-direction: column;
      }

      .hero-buttons .btn,
      .cta-buttons .btn {
        width: 100%;
      }

      .section {
        padding: 60px 0;
      }

      .mission-box {
        padding: 35px 25px;
      }

      .impact-grid,
      .process-grid {
        grid-template-columns: 1fr;
      }

      .form-grid {
        grid-template-columns: 1fr;
      }

      .form-group.full {
        grid-column: auto;
      }

      .request-form {
        padding: 25px 20px;
      }

      .request-info h2 {
        font-size: 30px;
      }

      .form-submit {
        flex-direction: column;
      }

      .language-inner {
        min-height: 44px;
      }

      .footer-grid {
        grid-template-columns: 1fr;
        gap: 30px;
      }
    }
