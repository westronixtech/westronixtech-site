/* Animated USA → AFRICA */

.usa-africa-route{
  display:inline-flex;
  align-items:center;
  gap:10px;
  margin-bottom:14px;
  padding:7px 12px;
  border:1px solid #ffffff22;

.usa-flag{

  transform-origin:left center;
  animation:usaFlagWave 2.4s ease-in-out infinite;
  filter:drop-shadow(0 3px 4px rgba(0,0,0,.25));
}

.route-arrow{
  display:inline-block;
  color:#69adff;
  font-size:23px;
  font-weight:900;
  animation:routeArrowPulse 2s ease-in-out infinite;
}

.africa-globe{
  display:inline-block;
  font-size:29px;
  transform-origin:center;
  animation:africaGlobeRotate 8s linear infinite;
  filter:drop-shadow(0 3px 5px rgba(0,0,0,.25));
}

@keyframes usaFlagWave{
  0%{
    transform:perspective(120px)
      rotateY(0deg)
      rotateZ(0deg)
      skewY(0deg);
  }

  20%{
    transform:perspective(120px)
      rotateY(10deg)
      rotateZ(-2deg)
      skewY(2deg);
  }

  40%{
    transform:perspective(120px)
      rotateY(-8deg)
      rotateZ(2deg)
      skewY(-2deg);
  }

  60%{
    transform:perspective(120px)
      rotateY(10deg)
      rotateZ(-2deg)
      skewY(2deg);
  }

  80%{
    transform:perspective(120px)
      rotateY(-5deg)
      rotateZ(1deg)
      skewY(-1deg);
  }

  100%{
    transform:perspective(120px)
      rotateY(0deg)
      rotateZ(0deg)
      skewY(0deg);
  }
}

@keyframes routeArrowPulse{

  0%,100%{
    transform:translateX(0);
    opacity:.65;
  }

  50%{
    transform:translateX(5px);
    opacity:1;
  }

}

@keyframes africaGlobeRotate{

  from{
    transform:rotate(0deg);
  }

  to{
    transform:rotate(360deg);
  }

}

/* =========================================================
   MARKETPLACE SEARCH
========================================================= */

function renderSuggestions(query){

  const container = document.getElementById("searchSuggestions");
  if(!container) return;

  const text = String(query || "").trim().toLowerCase();

  if(text.length < 2){
    container.innerHTML = "";
    container.style.display = "none";
    return;
  }

  const category = document.getElementById("categoryFilter")?.value || "all";

  const matches = inventory
    .filter(function(product){
      if(product.status === "inactive") return false;

      if(category !== "all"){
        const productCategory = String(product.category || "").toLowerCase();
        if(!productCategory.includes(category.toLowerCase())){
          return false;
        }
      }

      const searchable = [
        product.name,
        product.brand,
        product.category,
        product.sku,
        product.processor,
        product.ram,
        product.storage
      ].filter(Boolean).join(" ").toLowerCase();

      return searchable.includes(text);
    })
    .slice(0,5);

  if(!matches.length){
    container.innerHTML = "";
    container.style.display = "none";
    return;
  }

  container.innerHTML = matches.map(function(product){
    return `
      <div
        class="autocomplete-item"
        role="option"
        tabindex="0"
        data-sku="${escapeHTML(product.sku)}"
      >
        🔎
        <span>${escapeHTML(product.name)}</span>
      </div>
    `;
  }).join("");

  container.style.display = "block";

  container.querySelectorAll(".autocomplete-item").forEach(function(item){
    const go = function(){
      window.location.href =
        "product.html?sku=" + encodeURIComponent(item.dataset.sku);
    };

    item.addEventListener("click", go);
    item.addEventListener("keydown", function(event){
      if(event.key === "Enter"){
        go();
      }
    });
  });
}

function searchInventory(){

  const input = document.getElementById("homeSearch");
  const categorySelect = document.getElementById("categoryFilter");

  const query = (input?.value || "").trim();
  const category = categorySelect?.value || "all";

  const params = new URLSearchParams();

  if(query) params.set("q", query);
  if(category !== "all") params.set("category", category);

  window.location.href =
    "inventory.html" +
    (params.toString() ? "?" + params.toString() : "");
}

const searchButton =
  document.getElementById("searchButton");

const homeSearchInput =
  document.getElementById("homeSearch");

const categoryFilter =
  document.getElementById("categoryFilter");

if(searchButton){
  searchButton.addEventListener("click", searchInventory);
}

if(homeSearchInput){

  homeSearchInput.addEventListener("input", function(){
    renderSuggestions(this.value);
  });

  homeSearchInput.addEventListener("keydown", function(event){
    if(event.key === "Enter"){
      event.preventDefault();
      searchInventory();
    }

    if(event.key === "Escape"){
      const suggestions =
        document.getElementById("searchSuggestions");
      if(suggestions){
        suggestions.style.display = "none";
      }
    }
  });

  homeSearchInput.addEventListener("focus", function(){
    renderSuggestions(this.value);
  });
}

if(categoryFilter){

  categoryFilter.addEventListener("change", function(){
    renderSuggestions(homeSearchInput?.value || "");
  });
}

document.addEventListener("click", function(event){

  const searchArea =
    document.querySelector(".market-search");

  const suggestions =
    document.getElementById("searchSuggestions");

  if(
    searchArea &&
    suggestions &&
    !searchArea.contains(event.target)
  ){
    suggestions.style.display = "none";
  }

});

/* =========================================================
   MARKET CLOCK
========================================================= */

function updateMarketClock(){

  const clock =
    document.getElementById("marketClock");

  if(!clock) return;

  const now = new Date();

  const time =
    new Intl.DateTimeFormat(
      currentLanguage === "fr" ? "fr-FR" : "en-US",
      {
        hour:"2-digit",
        minute:"2-digit",
        second:"2-digit"
      }
    ).format(now);

  clock.textContent =
    "🕐 " + time;
}

setInterval(updateMarketClock,1000);


/* =========================================================
   COUNTDOWN REFRESH
========================================================= */

  document
    .querySelectorAll(".auction-countdown")
    .forEach(function(element){

      const end =
        element.dataset.end;

      element.textContent =
        countdownText(end);

    });

},1000);

========================================================= */
